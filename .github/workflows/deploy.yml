name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but never cancel one mid-flight either: a
# half-published Pages deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # public/CNAME and public/max/ are copied into dist by Astro. The custom
      # domain and the resume redirect both depend on that, and both would fail
      # silently, so assert it here rather than find out from a 404.
      - name: Check the custom domain and /max/ survived the build
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing — the custom domain would be dropped"; exit 1; }
          grep -qx 'v3rv.com' dist/CNAME || { echo "::error::dist/CNAME is not v3rv.com"; exit 1; }
          test -f dist/max/max_resume.pdf || { echo "::error::dist/max/max_resume.pdf missing"; exit 1; }

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
